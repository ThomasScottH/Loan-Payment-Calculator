
<!DOCTYPE html>
<html lang="en">
<head>
  <title>Loan Calculator</title>
</head>
<body>

  <h1>Loan Payment Calculator</h1>

  <label>Loan Amount:</label>
  <input id="loanAmount" type="number" value="20000">

  <label>Annual Interest Rate (%):</label>
  <input id="interestRate" type="number" value="6">

  <label>Loan Term (Years):</label>
  <input id="loanTerm" type="number" value="5">

  <button onclick="calculatePayment()">Calculate</button>

  <p id="output">Your payment will appear here.</p>

  <script>
    function calculatePayment() {
      let loanAmount = Number(document.getElementById("loanAmount").value);
      let interestRate = Number(document.getElementById("interestRate").value) / 100 / 12;
      let loanTerm = Number(document.getElementById("loanTerm").value) * 12;

      let payment;

      if (interestRate === 0) {
        payment = loanAmount / loanTerm;
      } else {
        payment = loanAmount * interestRate *
          Math.pow(1 + interestRate, loanTerm) /
          (Math.pow(1 + interestRate, loanTerm) - 1);
      }

      document.getElementById("output").textContent =
        "$" + payment.toFixed(2);
    }
  </script>

</body>
</html>
