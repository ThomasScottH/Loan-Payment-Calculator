<!DOCTYPE html>
<html>
<head>
    <title>Loan Calculator</title>

    <script>
        function calculatePayment() {
            // 3 inputs
            let P = Number(document.getElementById("loanAmount").value);
            let years = Number(document.getElementById("loanYears").value);
            let rate = Number(document.getElementById("interestRate").value) / 100 / 12;

            // Convert years to monthly payments
            let n = years * 12;

            // Calculate monthly payment
            let payment = P * rate / (1 - Math.pow(1 + rate, -n));

            // 1 output, rounded to 2 decimal places
            document.getElementById("output").innerHTML =
                "$" + payment.toFixed(2);
        }
    </script>
</head>

<body>

    <h1>Loan Calculator</h1>

    <label>Loan Amount ($):</label>
    <input type="number" id="loanAmount" value="20000">

    <br><br>

    <label>Loan Length (Years):</label>
    <input type="number" id="loanYears" value="5">

    <br><br>

    <label>Annual Interest Rate (%):</label>
    <input type="number" id="interestRate" value="6">

    <br><br>

    <button onclick="calculatePayment()">Calculate Payment</button>

    <h2>Monthly Payment: <span id="output">$0.00</span></h2>

</body>
</html>
